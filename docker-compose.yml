services:
  postgres:
    image: postgres:16-alpine
    container_name: klarwerk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: klarwerk
      POSTGRES_PASSWORD: klarwerk
      POSTGRES_DB: klarwerk
    ports:
      - "5433:5432"
    volumes:
      - klarwerk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klarwerk"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: klarwerk-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - klarwerk-redisdata:/data

  app:
    build: .
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://klarwerk:klarwerk@postgres:5432/klarwerk?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  klarwerk-pgdata:
  klarwerk-redisdata:
